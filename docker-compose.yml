services:
  mysql:
    image: mysql:8.0
    container_name: ecommerce-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecommerce_db
    volumes:
      - mysql_data:/var/lib/mysql

  mailhog:
    image: mailhog/mailhog
    container_name: ecommerce-mail
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql_data: